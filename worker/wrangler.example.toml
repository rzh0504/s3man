name = "s3man-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = false

# KV namespace for stored S3 configs (clean share URLs)
# Create with: wrangler kv namespace create S3_CONFIGS
# Then paste the id below:
[[kv_namespaces]]
binding = "S3_CONFIGS"
id = "replace-with-your-kv-namespace-id"

# Routes and custom domains are best managed in the Cloudflare Dashboard.
# Only uncomment this if you want wrangler deploy to manage routing too.
# routes = [
#   { pattern = "files.yourdomain.com/*", custom_domain = true }
# ]

# Secrets: wrangler secret put AUTH_TOKEN
