name: Build and Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Gradle memory
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          kotlin.daemon.jvmargs=-Xmx2g
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: |
          rm -rf android
          CI=1 pnpm exec expo prebuild --platform android

      - name: Validate Expo autolinking
        shell: bash
        run: |
          set -euo pipefail
          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          node --print "require.resolve('expo/package.json')"
          node --print "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"
          pnpm exec expo-modules-autolinking resolve --platform android --project-root "$PWD" --json > expo-autolinking-resolve.json
          pnpm exec expo-modules-autolinking react-native-config --platform android --project-root "$PWD" --source-dir android/app --json > expo-react-native-config.json

      - name: Tune Gradle for CI
        working-directory: android
        shell: bash
        run: |
          sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
          sed -i '/^org\.gradle\.daemon=/d' gradle.properties
          sed -i '/^org\.gradle\.parallel=/d' gradle.properties
          sed -i '/^org\.gradle\.workers\.max=/d' gradle.properties
          sed -i '/^kotlin\.daemon\.jvmargs=/d' gradle.properties
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=2"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
          } >> gradle.properties

      - name: Build release APK
        working-directory: android
        shell: bash
        env:
          NODE_ENV: production
        run: |
          chmod +x ./gradlew
          ./gradlew --stop || true
          ./gradlew assembleRelease --no-daemon --console=plain --warning-mode=summary --stacktrace

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: |
            expo-autolinking-resolve.json
            expo-react-native-config.json
            android/build/reports/problems/
          if-no-files-found: ignore

      - name: Upload APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
