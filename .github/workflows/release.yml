name: Build and Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --non-interactive

      - name: Tune Gradle for CI
        working-directory: android
        shell: bash
        run: |
          sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
          sed -i '/^org\.gradle\.daemon=/d' gradle.properties
          sed -i '/^org\.gradle\.parallel=/d' gradle.properties
          sed -i '/^org\.gradle\.workers\.max=/d' gradle.properties
          sed -i '/^kotlin\.daemon\.jvmargs=/d' gradle.properties
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
            echo "org.gradle.workers.max=2"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
          } >> gradle.properties

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload APK to GitHub release
        run: pnpm upload:github -- --path android/app/build/outputs/apk/release/app-release.apk --tag "${{ github.ref_name }}" --name "s3man-${{ github.ref_name }}.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
